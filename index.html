<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Analisi - Trade For Freedom</title>
<style>
  body {
    --bg: #0b0c0f;
    --line: rgba(255,255,255,.06); --line2: rgba(255,255,255,.12);
    --txt: #eaeaec; --dim: #85858f; --dimmer: #55555e;
    --up: #34d399; --down: #f87171; --flat: #fbbf24; --acc: #7dd3fc;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--txt); margin:0;
    min-height:100vh; -webkit-text-size-adjust:100%;
  }
  body * { box-sizing: border-box; margin: 0; padding: 0; }
  .hd { padding: 17px 19px 0; }
  .htop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .brand { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; letter-spacing: -.2px; }
  .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px rgba(125,211,252,.12); }
  .src { font-size: 10.5px; color: var(--dimmer); font-family: ui-monospace, monospace; text-align: right; line-height: 1.55; }
  .alert { margin-top: 12px; padding: 11px 13px; border-radius: 9px; font-size: 12.5px; line-height: 1.55; border: 1px solid; }
  .alert b { font-weight: 600; }
  .alert.warn { background: rgba(251,191,36,.07); border-color: rgba(251,191,36,.25); color: #ded0ac; }
  .alert.warn b { color: var(--flat); }
  .alert.info { background: rgba(125,211,252,.06); border-color: rgba(125,211,252,.2); color: #c1dae8; }
  .alert.info b { color: var(--acc); }
  .tabs { display: flex; gap: 1px; padding: 15px 19px 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim); font-size: 12.5px; font-weight: 500; padding: 7px 12px 9px; cursor: pointer; white-space: nowrap; font-family: inherit; display: flex; gap: 6px; align-items: center; }
  .tab:hover { color: var(--txt); }
  .tab.on { color: var(--txt); border-bottom-color: var(--acc); }
  .tab .n { font-size: 9.5px; font-family: ui-monospace, monospace; background: rgba(255,255,255,.05); padding: 1.5px 5px; border-radius: 3px; color: var(--dimmer); }
  .tab.on .n { color: var(--acc); background: rgba(125,211,252,.12); }
  .body { padding: 6px 19px 4px; border-top: 1px solid var(--line); margin-top: -1px; }
  .row { border-bottom: 1px solid var(--line); padding: 14px 0; cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:hover .tk { color: var(--acc); }
  .r1 { display: flex; align-items: center; gap: 9px; }
  .ar { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
  .tk { font-size: 14px; font-weight: 600; font-family: ui-monospace, monospace; letter-spacing: -.3px; transition: color .12s; }
  .chip { font-size: 9.5px; font-weight: 700; padding: 2.5px 6px; border-radius: 4px; letter-spacing: .3px; }
  .chip.up { background: rgba(52,211,153,.13); color: var(--up); }
  .chip.down { background: rgba(248,113,113,.13); color: var(--down); }
  .chip.flat { background: rgba(251,191,36,.13); color: var(--flat); }
  .vd { margin-left: auto; font-size: 11.5px; color: var(--dim); text-align: right; max-width: 45%; }
  .zones { display: flex; gap: 6px; margin: 9px 0 0 27px; flex-wrap: wrap; }
  .z { font-size: 10.5px; font-family: ui-monospace, monospace; padding: 3.5px 8px; border-radius: 5px; border: 1px solid var(--line2); display: flex; gap: 6px; align-items: center; }
  .z i { font-style: normal; font-size: 8.5px; letter-spacing: .5px; opacity: .6; text-transform: uppercase; }
  .z.sup { border-color: rgba(52,211,153,.28); color: #a7e8cd; }
  .z.res { border-color: rgba(248,113,113,.28); color: #f0b8b8; }
  .z.liq { border-color: rgba(125,211,252,.28); color: #bcdcec; }
  .det { margin: 11px 0 0 27px; display: none; }
  .row.open .det { display: block; }
  .det p { font-size: 12px; color: var(--dim); line-height: 1.6; }
  .mt { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--dimmer); }
  .mt b { color: var(--dim); font-weight: 500; }
  .empty { padding: 30px 8px; text-align: center; color: var(--dimmer); font-size: 12.5px; line-height: 1.6; }
  .ft { padding: 12px 19px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ftn { font-size: 10.5px; color: var(--dimmer); }
  .btn { background: none; border: 1px solid var(--line2); color: var(--dim); font-size: 10.5px; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .btn:hover { color: var(--txt); border-color: var(--dim); }

  .wrap { max-width: 760px; margin: 0 auto; }
  .imp { margin: 12px 19px 0; }
  .imp textarea { width:100%; height:90px; background:#111217; color:var(--dim); border:1px solid var(--line2); border-radius:8px; padding:9px 11px; font-family:ui-monospace,monospace; font-size:11px; resize:vertical; }
  .imp .rw { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .msg { font-size:11px; color:var(--acc); margin-top:7px; }
  .hidden { display:none; }
  @media (max-width:520px){ .vd{max-width:100%; text-align:left; margin-left:0; margin-top:5px;} .r1{flex-wrap:wrap;} }
</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<script>
(function () {
  var DEFAULT = (function(){
    var D = {
    src: "ANALISI (MARCO) · Trade For Freedom",
    dated: "aggiornato 4 ago, 11:52",
    alerts: [
      { t: "info", h: "Quadro generale", b: "Marco vede <b>tutto molto piatto</b>. Nessuna occasione forte in vista: continua a cercare e accetta richieste di analisi specifiche in chat." },
      { t: "warn", h: "Come leggere le zone", b: "Con bias <b>ribassista</b> rispondono meglio le <b>resistenze</b>; con bias <b>rialzista</b> i <b>supporti</b>. Le zone su timeframe alto pesano più di quelle su timeframe basso." }
    ],
    assets: [
      { cat:"cripto", tk:"BTC", trend:"flat", verdict:"Come ieri, nessuna novità",
        sup:["62.100 · tf basso"], res:["67-68k"],
        note:"Situazione praticamente identica a ieri. L'unica differenza è un piccolo cluster/supporto formatosi su timeframe basso a 62.100$, che proprio per questo offre meno vantaggio statistico. Sopra resta la zona 67-68k, resistenza enorme visibile da tempo.",
        when:"oggi 11:13" },
      { cat:"cripto", tk:"HYPE", trend:"down", verdict:"Resistenza forte a 56.60",
        sup:["53.75-54 · tf basso"], res:["56.60"],
        note:"Bias ribassista nel breve periodo. La zona 56.60 e' una resistenza ad alto vantaggio statistico: non e' garanzia che il prezzo scendera', ma storicamente in questi contesti quelle zone rispondono. Il supporto sotto e' su timeframe molto basso, quindi vale meno.",
        edge:"resistenze", when:"oggi 11:16" },
      { cat:"cripto", tk:"ETH", trend:"flat", verdict:"Respinto sui massimi",
        sup:["1789-1810"], res:["1930", "2000-2030"],
        note:"Dopo il rimbalzo perfetto sul supporto a 1715 di qualche settimana fa, ETH come BTC ha provato ad attaccare nuovi massimi ed e' stato respinto. La resistenza a 2000-2030 e' la piu' grossa, visibile su tutti i timeframe.",
        when:"ieri 13:09" },
      { cat:"cripto", tk:"SOL", trend:"down", verdict:"Piu' debole del resto del cripto",
        sup:["71.28-71.90", "68.40-69.35"], res:["79"],
        note:"Leggermente piu' debole rispetto al resto del mercato cripto: bias ribassista sui timeframe bassi dentro una giornata di bias rialzista. Ci sono due cluster vicini tra loro: il primo offre piu' probabilita' di entrata ma piu' rischio di stop loss, il secondo meno probabilita' ma maggiore vantaggio statistico. Marco ricorda che non c'e' un meglio e un peggio, e' una scelta personale su quanto rischiare.",
        edge:"resistenze", when:"ieri 12:30" },
      { cat:"cripto", tk:"ZEC", trend:"flat", verdict:"Tra supporto e resistenza",
        sup:["436-447"], res:["~500"],
        note:"Supporto/cluster nella fascia 436-447$, resistenza intorno ai 500$. Marco rimanda a un audio in chat dove spiega l'approccio psicologico alle entrate sui supporti e sulle resistenze.",
        when:"ieri 13:06" },
      { cat:"cripto", tk:"TAO", trend:"down", verdict:"Tornato ai prezzi pre-boom",
        sup:["180-182 · tf basso", "160-168"], res:["201-206"],
        note:"Dopo il boom legato all'intelligenza artificiale bannata dagli Stati Uniti, e' tornato circa ai prezzi di prima. Marco lo usa come lezione sulla FOMO: dura poco, meglio non farsi trascinare da mini trend che durano una settimana. Sul lungo periodo la bias resta ribassista, quindi questi supporti hanno vantaggio statistico inferiore.",
        edge:"resistenze", when:"ieri 13:17" },
      { cat:"cripto", tk:"ONDO", trend:"down", verdict:"Ha retto meglio di TAO",
        sup:["0.3480-0.3550 · tf basso", "0.3285-0.3360 · tf alto"], res:["0.3940 · tf basso", "0.43 · tf alto"],
        note:"Anche ONDO e' stato vittima della FOMO negli scorsi mesi, ma ha retto un po' meglio di TAO. Al momento sta prendendo una piccola liquidita' che, col senno di poi, sembra non dare grande reazione.",
        when:"ieri 13:29" },
      { cat:"cripto", tk:"$CC", trend:"flat", verdict:"Liquidita' non ancora presa",
        liq:["0.1020-0.1060"],
        note:"Canton Network. La spike sulla penultima candela H4 non ha nemmeno scalfito la liquidita'. Marco la chiama ingegnerizzazione di liquidita': far credere alla massa che la liquidita' sia stata presa o che sia partito un rimbalzo, cosi' le persone entrano long e mettono stop loss sotto, creando altra liquidita'. Entrare prima che la liquidita' venga presa e' a vantaggio statistico inferiore. Queste fasi possono durare a lungo.",
        edge:"aspettare", when:"oggi 11:52" },
      { cat:"meme", tk:"$PONS", trend:"down", verdict:"Trendline rotta, ora su supporto",
        note:"Dopo il lancio della versione 2 ci sono stati problemi tecnici: i nuovi lanci sono stati disabilitati per via di token snipati, e stanno implementando una correzione. Rottura della trendline esattamente come da analisi: statisticamente le meme, o i progetti legati ad esse, ritracciano sempre forte. Ora sta rimbalzando su un cluster/supporto, da vedere se regge e soprattutto in quanto tempo risolvono i problemi della V2.",
        drv:"Problemi tecnici V2", when:"ieri 15:38" },
      { cat:"materie", tk:"PETROLIO", trend:"up", verdict:"In arrivo sul supporto previsto",
        sup:["76.42-77.50"], res:["86.62-88 · gap"],
        note:"Sta arrivando sul supporto come da analisi, e per una volta la divergenza BTC/petrolio e' a favore di BTC. E' il classico asset ad alta volatilita' che sembra offrire grandi occasioni, ma con la geopolitica di mezzo diventa complesso da operare: basta una notizia e analisi di liquidita' e analisi tecnica perdono significato. Con bias rialzista il vantaggio statistico sulle resistenze e' nettamente inferiore.",
        edge:"supporti", drv:"Geopolitica", when:"oggi" },
      { cat:"materie", tk:"ARGENTO", trend:"down", verdict:"Lateralizza, nuovo supporto",
        sup:["55.51-55.96 · nuovo", "55.79-56.40"], res:["61"],
        note:"Profonda fase di lateralizzazione: Marco ammette che il grafico non gli piace. La bias non e' chiara sui timeframe bassi, ma sul lungo periodo e' sicuramente ribassista, quindi il maggior vantaggio statistico e' che il prezzo risponda alle resistenze e non ai supporti.",
        edge:"resistenze", when:"oggi 11:30" },
      { cat:"forex", tk:"NASDAQ", trend:"up", verdict:"Sale contro i dati macro",
        sup:["28.700-28.780 · tf bassissimo", "26.754 · tf alto"], res:["29.450", "30.216"],
        note:"Caso di divergenza tra situazione geopolitica-macroeconomica e indici di borsa: nonostante dati pessimi il mercato continua a salire. I cluster di supporto sono tutti molto frazionati, l'unica zona interessante in basso e' su timeframe bassissimo. Il supporto a 26.754 e' lontano dal prezzo ma su timeframe alto, quindi con vantaggio statistico maggiore.",
        when:"oggi 11:22" },
      { cat:"forex", tk:"SP500", trend:"up", verdict:"Nuova resistenza dopo il rimbalzo",
        sup:["7350"], res:["7535 · tf basso", "7650 · massimi storici"],
        note:"Dopo il rimbalzo sul supporto a 7350 il prezzo si sta appoggiando su una nuova resistenza a 7535$, che pero' essendo su timeframe basso ha vantaggio statistico inferiore. Il vero cluster/resistenza, gia' ripetuto piu' volte, e' in zona 7650, area dei massimi storici.",
        when:"ieri 11:56" },
      { cat:"forex", tk:"NZDCAD", trend:"up", verdict:"Bias forte, 0.8337 come obiettivo",
        sup:["0.8227", "0.82"], res:["0.8337 · settimanale"],
        note:"Forte bias rialzista con liquidita' settimanale sotto forma di resistenza a 0.8337. La liquidita' individuata su timeframe settimanale e' tra le piu' potenti e offre il maggior vantaggio statistico: con bias rialzista Marco la legge come un obiettivo per il prezzo, perche' con un cluster cosi' grande in alto e' probabile che le istituzioni vadano a raggiungerlo per usarlo come exit liquidity. Sotto, due piccoli supporti di breve periodo.",
        edge:"supporti", when:"oggi 11:39" },
      { cat:"forex", tk:"AUDCHF", trend:"flat", verdict:"Resistenza carica e ben definita",
        res:["0.5697-0.57"],
        note:"Cluster/resistenza molto carico e ben definito nella fascia 0.5697-0.57. Il messaggio e' troncato nello screenshot, potrebbero mancare i livelli di supporto.",
        when:"oggi 11:33" }
    ]
  };
    return D;
  })();

  var D = DEFAULT;
  var CATS = [
    { id:"cripto", l:"Cripto" }, { id:"meme", l:"Meme" },
    { id:"materie", l:"Materie prime" }, { id:"azioni", l:"Azioni" },
    { id:"forex", l:"Forex / Indici" }
  ];
  var act = "cripto", open = {}, showImp = false, msg = "";

  try {
    var saved = localStorage.getItem("analisi_tff");
    if (saved) D = JSON.parse(saved);
  } catch (e) {}

  function save() {
    try { localStorage.setItem("analisi_tff", JSON.stringify(D)); } catch (e) {}
  }

  function ar(t) {
    return t === "up" ? { c:"var(--up)", s:"\u25B2", l:"RIALZISTA" }
         : t === "down" ? { c:"var(--down)", s:"\u25BC", l:"RIBASSISTA" }
         : { c:"var(--flat)", s:"\u25AC", l:"LATERALE" };
  }

  function render() {
    var root = document.getElementById("root");
    var list = D.assets.filter(function (a) { return a.cat === act; });

    var tabs = CATS.map(function (c) {
      var n = D.assets.filter(function (a) { return a.cat === c.id; }).length;
      return '<button class="tab' + (c.id === act ? ' on' : '') + '" data-c="' + c.id + '">' + c.l + '<span class="n">' + n + '</span></button>';
    }).join("");

    var alerts = (D.alerts||[]).map(function (a) {
      return '<div class="alert ' + a.t + '"><b>' + a.h + '</b> \u2014 ' + a.b + '</div>';
    }).join("");

    var rows = list.length ? list.map(function (a, i) {
      var A = ar(a.trend), k = act + i;
      var zs = (a.sup || []).map(function (z) { return '<div class="z sup"><i>sup</i>' + z + '</div>'; })
        .concat((a.res || []).map(function (z) { return '<div class="z res"><i>res</i>' + z + '</div>'; }))
        .concat((a.liq || []).map(function (z) { return '<div class="z liq"><i>liq</i>' + z + '</div>'; })).join("");
      var mt = [];
      if (a.edge) mt.push('<span><b>Vantaggio su:</b> ' + a.edge + '</span>');
      if (a.drv) mt.push('<span><b>Driver:</b> ' + a.drv + '</span>');
      if (a.when) mt.push('<span>' + a.when + '</span>');
      return '<div class="row' + (open[k] ? ' open' : '') + '" data-k="' + k + '">' +
        '<div class="r1">' +
          '<div class="ar" style="color:' + A.c + '">' + A.s + '</div>' +
          '<div class="tk">' + a.tk + '</div>' +
          '<span class="chip ' + a.trend + '">' + A.l + '</span>' +
          '<div class="vd">' + a.verdict + '</div>' +
        '</div>' +
        (zs ? '<div class="zones">' + zs + '</div>' : '') +
        '<div class="det"><p>' + a.note + '</p>' + (mt.length ? '<div class="mt">' + mt.join("") + '</div>' : '') + '</div>' +
      '</div>';
    }).join("") : '<div class="empty">Nessuna analisi in questa categoria.</div>';

    root.innerHTML =
      '<div class="hd"><div class="htop">' +
        '<div class="brand"><div class="pip"></div>Analisi</div>' +
        '<div class="src">' + D.src + '<br>' + D.dated + '</div>' +
      '</div>' + alerts + '</div>' +
      '<div class="imp' + (showImp ? '' : ' hidden') + '">' +
        '<textarea id="ta" placeholder="Incolla qui il blocco dati aggiornato che ti do in chat"></textarea>' +
        '<div class="rw"><button class="btn" id="doimp">Carica dati</button>' +
        '<button class="btn" id="doexp">Copia dati attuali</button></div>' +
        (msg ? '<div class="msg">' + msg + '</div>' : '') +
      '</div>' +
      '<div class="tabs">' + tabs + '</div>' +
      '<div class="body">' + rows + '</div>' +
      '<div class="ft"><div class="ftn">Tocca una riga per l\'analisi completa</div>' +
      '<button class="btn" id="tgl">' + (showImp ? 'Chiudi' : 'Aggiorna dati') + '</button></div>';

    root.querySelectorAll(".tab").forEach(function (t) { t.onclick = function () { act = t.dataset.c; render(); }; });
    root.querySelectorAll(".row").forEach(function (r) { r.onclick = function () { open[r.dataset.k] = !open[r.dataset.k]; render(); }; });

    document.getElementById("tgl").onclick = function () { showImp = !showImp; msg = ""; render(); };

    var imp = document.getElementById("doimp");
    if (imp) imp.onclick = function () {
      var raw = document.getElementById("ta").value.trim();
      if (!raw) { msg = "Incolla prima i dati."; return render(); }
      try {
        var obj = JSON.parse(raw);
        if (!obj.assets) throw new Error("manca assets");
        D = obj; save(); msg = "Dati aggiornati."; showImp = false; open = {};
      } catch (e) { msg = "Il testo incollato non e' valido. Ricontrolla di aver copiato tutto."; }
      render();
    };

    var exp = document.getElementById("doexp");
    if (exp) exp.onclick = function () {
      var t = JSON.stringify(D, null, 1);
      document.getElementById("ta").value = t;
      try { navigator.clipboard.writeText(t); msg = "Copiato negli appunti."; } catch (e) { msg = "Selezionalo dal riquadro e copialo."; }
      render();
    };
  }

  render();
})();
</script>
</body>
</html>
